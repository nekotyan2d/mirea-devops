- name: Check target OS
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'

- name: Install Ansible module dependencies
  ansible.builtin.apt:
    name:
      - python3-debian
      - python3-requests
      - ca-certificates
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker-pr11.asc
    mode: "0644"

- name: Configure official Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: [https://download.docker.com/linux/ubuntu]
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker-pr11.asc
  register: docker_repository

- name: Remove superseded Docker APT list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  register: docker_legacy_repository

- name: Install Docker Engine
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io]
    update_cache: "{{ docker_repository.changed or docker_legacy_repository.changed }}"

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
